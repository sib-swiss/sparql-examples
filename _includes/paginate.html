<script>
// Client-side pagination for long "Examples" lists (generated index.md
// files under examples/<resource>/). Runs against whatever list the
// generator produced, so it survives regeneration by sparql-examples-utils.
(function () {
  var PAGE_SIZE = 25;

  function paginate(list) {
    var items = Array.prototype.filter.call(list.children, function (el) {
      return el.tagName === 'LI';
    });
    if (items.length <= PAGE_SIZE) {
      return;
    }

    var pageCount = Math.ceil(items.length / PAGE_SIZE);

    var nav = document.createElement('nav');
    nav.className = 'pagination';
    nav.setAttribute('aria-label', 'Examples pages');
    list.insertAdjacentElement('afterend', nav);

    var status = document.createElement('span');
    status.className = 'pagination__status';

    var prevBtn = makeButton('← Prev', function () {
      showPage(Math.max(0, current - 1));
    });
    var nextBtn = makeButton('Next →', function () {
      showPage(Math.min(pageCount - 1, current + 1));
    });

    var pageButtons = [];
    for (var i = 0; i < pageCount; i++) {
      pageButtons.push(makeButton(String(i + 1), showPageFactory(i), i));
    }

    nav.appendChild(prevBtn);
    pageButtons.forEach(function (btn) {
      nav.appendChild(btn);
    });
    nav.appendChild(nextBtn);
    nav.appendChild(status);

    var current = 0;

    function makeButton(label, onClick, page) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      if (page !== undefined) {
        btn.dataset.page = String(page);
      }
      btn.addEventListener('click', onClick);
      return btn;
    }

    function showPageFactory(page) {
      return function () {
        showPage(page);
      };
    }

    function showPage(page) {
      current = page;
      items.forEach(function (li, index) {
        li.style.display = Math.floor(index / PAGE_SIZE) === page ? '' : 'none';
      });
      pageButtons.forEach(function (btn, index) {
        var isActive = index === page;
        btn.classList.toggle('is-active', isActive);
        btn.setAttribute('aria-current', isActive ? 'page' : 'false');
      });
      prevBtn.disabled = page === 0;
      nextBtn.disabled = page === pageCount - 1;
      var first = page * PAGE_SIZE + 1;
      var last = Math.min((page + 1) * PAGE_SIZE, items.length);
      status.textContent = 'Showing ' + first + '–' + last + ' of ' + items.length;
    }

    showPage(0);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var lists = document.querySelectorAll('.site-main__inner > ul');
    Array.prototype.forEach.call(lists, paginate);
  });
})();
</script>
