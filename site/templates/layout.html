<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" type="image/svg+xml" href="/assets/images/sib-logo.svg">
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="/">
          <img class="site-brand__logo" src="/assets/images/sib-logo.svg" alt="{{siteTitle}} logo" />
          <span class="site-brand__title">{{siteTitle}}</span>
        </a>
        <div class="site-search">
          <input type="search" id="site-search-input" class="site-search__input" placeholder="Search examples…" autocomplete="off" aria-label="Search examples">
          <ul id="site-search-results" class="site-search__results" hidden></ul>
        </div>

        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="https://www.expasy.org">Expasy</a>
          <a href="https://www.sib.swiss">SIB</a>
          <a href="{{repositoryUrl}}">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="site-main__inner">
        {{breadcrumb}}
        {{badge}}
        {{content}}
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>
          A resource of the <a href="https://www.sib.swiss">SIB Swiss Institute of Bioinformatics</a>.
          Source and contributions on <a href="{{repositoryUrl}}">GitHub <small>{{repositoryName}}</small></a>.
        </p>
      </div>
    </footer>

    <!-- include: mermaid.html -->
    <!-- include: examples-table.html -->
    <!-- include: search.html -->
    <!-- include: matamo.html -->
  </body>
</html>
