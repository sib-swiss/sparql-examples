# Publishes the Markdown pages.
name: Publish to github-pages

on:
  push:
    branches: [ "master" ]

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
jobs:
  publish_html:
    name: "publish html"
    runs-on: ubuntu-latest 
    steps: 
    - uses: actions/checkout@v6
    
    - uses: actions/setup-java@v5
      with:
        distribution: 'graalvm'
        java-version: '25'
    
    - name: Install tester
      run: wget "https://github.com/sib-swiss/sparql-examples-utils/releases/download/v2.0.24/sparql-examples-utils-2.0.24-uber.jar" -O sparql-examples-utils-uber.jar

    - name: generate markdown
      run: java -jar sparql-examples-utils-uber.jar convert -i examples/ -m 
    
    - name: generate rq files
      run: java -jar sparql-examples-utils-uber.jar convert -i examples/ -r

    - name: concatenate all examples into one ttl file
      run: java -jar sparql-examples-utils-uber.jar convert -i examples/ -p all -f ttl > all.ttl

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: List the repositories made from the template
      run: node site/template-users.mjs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build the site
      run: npm run build
      env:
        # The project site is served from /sparql-examples, so links need that prefix.
        SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish_html
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
